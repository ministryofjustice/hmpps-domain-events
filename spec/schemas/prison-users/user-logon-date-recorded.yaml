name: prison-users.user.logon.date.recorded
title: Prison Users API – a user logon date was recorded
contentType: application/json
payload:
  type: object
  properties:
    version:
      const: 1
    eventType:
      const: prison-users.user.logon.date.recorded
    occurredAt:
      type: string
      format: date-time
      example: 2023-12-05T12:34:56+00:00
    description:
      type: string
      example: A prison user logon date has been recorded
    additionalInformation:
      type: object
      properties:
        userId:
          description: The ID of the user
          type: string
          format: uuid
          example: 11111111-2222-3333-4444-555555555555
        legacyStaffId:
          description: The legacy staff ID of the user
          type: integer
          example: 12345
        username:
          description: The account username
          type: string
          example: ATURNER_GEN