name: prison-property.container.created
title: prison-property.container.created
summary: A property container has been created
description: |
  This event is raised when a property container is added.
contentType: application/json
payload:
  type: object
  required: [prisonerNumber, eventType, occurredAt, version]
  properties:
    prisonerNumber:
      type: string
      description: Prison number of the prisoner
      pattern: '[A-Z][0-9]{4}[A-Z]{2}'
      example: A5763DZ
    additionalInformation:
      type: object
      required: [dpsId]
      properties:
        dpsId:
          type: string
          format: uuid
          description: ID of the DPS record
          example: '123e4567-e89b-12d3-a456-426614174000'
    description:
      type: string
      const: A prisoner property container was changed in DPS
    eventType:
      type: string
      const: prison-property.container.created
    occurredAt:
      type: string
      description: The date and time the event occurred
      format: date-time
      example: '2024-10-14T12:49:12+01:00'
    source:
      type: string
      description: The source of the event, DPS or NOMIS
      example: DPS
    version:
      type: integer
      description: Version of this event message. Currently 1
      example: 1
